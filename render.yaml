services:
  - type: web
    name: blessing-webull-realtime
    runtime: python
    region: singapore
    plan: free
    rootDir: realtime
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: WEBULL_APP_KEY
        sync: false
      - key: WEBULL_APP_SECRET
        sync: false
      - key: WEBULL_REGION
        value: th
      - key: WEBULL_HTTP_HOST
        value: api.webull.com
      - key: WEBULL_MQTT_HOST
        value: data-api.webull.com
      - key: WEBULL_SYMBOLS
        value: AAPL,MSFT,NVDA,AMZN,GOOGL,META,TSLA,AMD
      - key: ALLOWED_ORIGINS
        value: https://blessing.carbontokeno1.workers.dev
