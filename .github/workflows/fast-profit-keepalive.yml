name: FAST PROFIT LAB — Free Keep-Alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-profit-lab-keepalive
  cancel-in-progress: true

jobs:
  ping-paper-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check configured health URL
        env:
          HEALTH_URL: ${{ vars.FAST_PROFIT_HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "::notice::Set repository variable FAST_PROFIT_HEALTH_URL to the Render service base URL. No request was sent."
            exit 0
          fi
          case "$HEALTH_URL" in
            https://*) ;;
            *) echo "::error::FAST_PROFIT_HEALTH_URL must use HTTPS"; exit 1 ;;
          esac
          curl --fail --silent --show-error --max-time 20 "${HEALTH_URL%/}/health"
          echo "Health check completed."
