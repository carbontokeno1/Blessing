name: Keep BLESSING Paper Monitor Awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blessing-paper-monitor-keepalive
  cancel-in-progress: true

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Wake Render and verify health endpoint
        shell: bash
        run: |
          set -euo pipefail
          URL="https://blessing-webull-realtime-djfm.onrender.com/health"
          BODY="$(curl --fail --silent --show-error --location --max-time 45 "$URL")"
          echo "$BODY"
          echo "$BODY" | grep -q '"ok":true'
