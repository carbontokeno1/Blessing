name: BLESSING Python tests

on:
  push:
    branches:
      - feature/broker-readonly-integration
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r realtime/requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q realtime
      - name: Run unit tests
        working-directory: realtime
        run: python -m unittest discover -s . -p "test_*.py" -v
