<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b12"><title>Blessing | Trading Platform</title>
<style>
:root{color-scheme:dark;--bg:#080b12;--panel:#111827;--panel2:#151f30;--line:#29364a;--gold:#e8bd62;--gold2:#b88a32;--muted:#9aa8bc;--green:#43d6a0;--red:#ff7185;--blue:#83b8ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#29334a 0,transparent 50%),var(--bg);color:#f7f8fb;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #574624;border-radius:10px;padding:10px 14px;background:linear-gradient(135deg,#f0ce7d,#b88a32);color:#17130b;font-weight:800}button.secondary{background:#202c40;border-color:#34445d;color:#e7edf7}button.danger{background:#381d29;border-color:#673143;color:#ff9bad}button:disabled{opacity:.4;cursor:not-allowed}.hidden{display:none!important}.muted{color:var(--muted)}.gold{color:var(--gold)}.small{font-size:11px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:48px;height:48px;object-fit:contain}.brand b{letter-spacing:3px;font-size:22px;color:var(--gold)}.brand span{display:block;color:var(--muted);font-size:10px;letter-spacing:2px}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(420px,100%);padding:30px;border:1px solid #5b4928;border-radius:22px;background:linear-gradient(145deg,#182235,#0d1420);box-shadow:0 25px 80px #0008}.loginbox .brand{justify-content:center;margin-bottom:24px}.loginbox h1{text-align:center;font-size:23px}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:12px;color:var(--muted)}input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #344258;background:#0b1220;color:#fff;outline:none}input:focus,select:focus{border-color:var(--gold)}.full{width:100%;margin-top:8px}.demo-note{margin-top:18px;padding:12px;border:1px solid #69552d;background:#211b11;border-radius:12px;color:#e8d8ad;line-height:1.6;font-size:11px}.app{max-width:1240px;margin:auto;padding:20px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;padding:8px 0 20px;border-bottom:1px solid var(--line)}.userbox{display:flex;align-items:center;gap:10px}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#493a20;color:var(--gold);font-weight:900}.tabs{display:flex;gap:8px;overflow:auto;padding:17px 0}.tab{white-space:nowrap;background:#131d2c;border:1px solid #2d3a4e;color:#b9c5d6}.tab.active{background:#332a19;color:var(--gold);border-color:#81652e}.heading{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin:10px 0 18px}.heading h1{margin:0;font-size:26px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:15px 0}.card{background:linear-gradient(145deg,#151f30,#0e1623);border:1px solid var(--line);border-radius:16px;padding:17px;min-width:0}.metric label{font-size:11px;color:var(--muted)}.metric strong{display:block;font-size:25px;margin-top:8px;font-variant-numeric:tabular-nums}.layout{display:grid;grid-template-columns:1.35fr 1fr;gap:14px}.card h3{margin:0 0 14px;font-size:15px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #283448}.row:last-child{border:0}.stock{font-weight:800}.positive{color:var(--green)}.negative{color:var(--red)}.actions{display:flex;gap:6px}.actions button{padding:7px 10px;font-size:11px}.pill{border:1px solid #66542e;border-radius:30px;padding:5px 9px;color:var(--gold);font-size:10px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #283448;font-size:12px}th{color:var(--muted);font-weight:600}.status{font-size:10px;border-radius:20px;padding:5px 8px;background:#19372e;color:#70e4b7}.status.pending{background:#3c321d;color:#f1ce77}.status.suspended{background:#40212a;color:#ff9bad}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar input{max-width:220px}.notice{border:1px solid #6d572d;background:#211b11;color:#ead8a8;border-radius:13px;padding:13px;font-size:12px;line-height:1.65;margin:14px 0}.dangerbox{border-color:#6c3340;background:#25131b;color:#ffb0bc}.section{margin-top:16px}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.riskline{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #29364a;font-size:12px}.empty{padding:20px 0;color:var(--muted);font-size:12px}.foot{padding:28px 0 10px;color:#748197;text-align:center;font-size:10px}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}}@media(max-width:480px){.app{padding:14px}.grid{gap:8px}.card{padding:13px}.metric strong{font-size:20px}.heading h1{font-size:22px}.brand b{font-size:19px}}
</style></head><body>
<main id="app" class="app"><header class="topbar"><div class="brand"><img src="/logo.svg" alt="Blessing"><div><b>BLESSING</b><span>SMART TRADING PLATFORM</span></div></div><div class="userbox"><span class="pill">ADMIN WORKSPACE</span><div class="avatar">A</div><div><b>ผู้ดูแลระบบ</b><div class="small muted">Blessing Control Center</div></div></div></header>
<nav class="tabs" id="tabs"></nav><div id="view"></div><div class="foot">BLESSING · SECURE TRADING WORKSPACE · PROTOTYPE BUILD</div></main>
<script>
const $=id=>document.getElementById(id);let role='admin',active='overview',cash=100000,holdings={},orders=[],members=[],prices={AAPL:192.4,NVDA:141.8,TSLA:338.2,AMD:162.3,PLTR:48.6,SOFI:15.2,MARA:22.7,SMCI:39.4};const money=n=>'฿'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});const names={overview:'ภาพรวม',members:'จัดการสมาชิก',paper:'ทดลองเทรด',live:'เทรดเงินจริง',history:'ประวัติ',settings:'ตั้งค่า'};
function nav(){let keys=role==='admin'?['overview','members','paper','live','history','settings']:['overview','paper','live','history','settings'];$('tabs').innerHTML=keys.map(k=>'<button class="tab '+(active===k?'active':'')+'" onclick="go(\''+k+'\')">'+names[k]+'</button>').join('')}
function go(k){active=k;render()}
function pnl(){return Object.entries(holdings).reduce((s,[k,v])=>s+v*prices[k],cash)-100000}
function render(){nav();let v=$('view');if(active==='overview'){v.innerHTML=overview();if(role==='member')loadMemberData()}if(active==='members')v.innerHTML=membersView();if(active==='paper')v.innerHTML=paperView();if(active==='live')v.innerHTML=liveView();if(active==='history')v.innerHTML=historyView();if(active==='settings')v.innerHTML=settingsView()} async function loadMemberData(){const sb=window.BLESSING_AUTH?.client;if(!sb)return;const [w,t]=await Promise.all([sb.from('wallets').select('currency,balance').order('currency'),sb.from('trades').select('id,mode,symbol,side,quantity,price,status,created_at').order('created_at',{ascending:false}).limit(5)]);const b=document.getElementById('memberBalance'),n=document.getElementById('memberTradeCount'),r=document.getElementById('memberRecent');if(b)b.textContent=w.error?'โหลดไม่ได้':(w.data?.length?w.data.map(x=>Number(x.balance).toLocaleString('en-US')+' '+x.currency).join(' / '):'ยังไม่มีข้อมูล');if(n)n.textContent=t.error?'—':String(t.data?.length||0);if(r)r.innerHTML=t.error?'โหลดข้อมูลไม่สำเร็จ':(t.data?.length?t.data.map(x=>'<div class=\'row\'><span>'+esc(x.side)+' '+esc(x.symbol)+' · '+esc(x.mode)+'</span><b>'+Number(x.quantity).toLocaleString()+'</b></div>').join(''):'ยังไม่มีรายการเทรด')}
function overview(){if(role==='member')return memberOverview();let eq=Object.entries(holdings).reduce((s,[k,q])=>s+q*prices[k],cash);return '<div class="heading"><div><h1>ศูนย์ควบคุมผู้ดูแลระบบ</h1><div class="muted">Super Admin / Admin Control Center</div></div><span class="pill">ADMIN ONLY</span></div><div class="grid"><div class="card metric"><label>มูลค่าพอร์ตทดลอง</label><strong>'+money(eq)+'</strong></div><div class="card metric"><label>กำไร / ขาดทุนทดลอง</label><strong class="'+(pnl()>=0?'positive':'negative')+'">'+money(pnl())+'</strong></div><div class="card metric"><label>สมาชิกในหน้าตัวอย่าง</label><strong>'+members.length+'</strong></div><div class="card metric"><label>คำสั่งทดลอง</label><strong>'+orders.length+'</strong></div></div><div class="layout"><div class="card"><h3>เครื่องมือผู้ดูแล</h3><div class="row"><span>จัดการสมาชิกและสถานะบัญชี</span><button onclick="go(\'members\')">จัดการสมาชิก</button></div><div class="row"><span>ตรวจสอบประวัติ</span><button class="secondary" onclick="go(\'history\')">ดูประวัติ</button></div><div class="row"><span>ตั้งค่าความปลอดภัย</span><button class="secondary" onclick="go(\'settings\')">ตั้งค่า</button></div></div><div class="card"><h3>สถานะระบบ</h3><div class="riskline"><span>สิทธิ์</span><b class="positive">ผู้ดูแลระบบ</b></div><div class="riskline"><span>ระบบเงินจริง</span><b class="negative">ปิดใช้งาน</b></div></div></div><div class="notice">ข้อมูลพอร์ตเป็นข้อมูลทดลอง ไม่ใช่บัญชีเงินจริง</div>'}
function memberOverview(){const p=window.BLESSING_AUTH?.profile||{};return '<div class="heading"><div><h1>พื้นที่สมาชิก</h1><div class="muted">ข้อมูลบัญชีส่วนตัวของคุณเท่านั้น</div></div><span class="pill">MEMBER PORTAL</span></div><div class="grid"><div class="card metric"><label>ชื่อสมาชิก</label><strong style="font-size:18px">'+esc(p.display_name||p.email||'สมาชิก')+'</strong></div><div class="card metric"><label>สถานะบัญชี</label><strong class="positive" style="font-size:18px">ใช้งาน</strong></div><div class="card metric"><label>กระเป๋าของฉัน</label><strong id="memberBalance" style="font-size:17px">กำลังโหลด</strong></div><div class="card metric"><label>รายการเทรดล่าสุด</label><strong id="memberTradeCount">กำลังโหลด</strong></div></div><div class="layout"><div class="card"><h3>ข้อมูลบัญชีของฉัน</h3><div class="riskline"><span>อีเมล</span><b>'+esc(p.email||'')+'</b></div><div class="riskline"><span>ประเภทบัญชี</span><b>สมาชิก</b></div><div class="riskline"><span>สิทธิ์ข้อมูล</span><b class="positive">เฉพาะข้อมูลของฉัน</b></div><div class="row"><span>เปลี่ยนรหัสผ่าน</span><button onclick="go(\'settings\')">เปิดการตั้งค่า</button></div></div><div class="card"><h3>รายการของฉัน</h3><div id="memberRecent" class="empty">กำลังโหลดข้อมูลส่วนตัว...</div></div></div><div class="notice">สมาชิกไม่สามารถเปิดเมนูบริหารระบบหรือดูข้อมูลสมาชิกคนอื่นได้</div>'}
function membersView(){return '<div class="heading"><div><h1>จัดการสมาชิก</h1><div class="muted">สร้างบัญชีและควบคุมสถานะสมาชิก (ตัวอย่างหน้าจอ)</div></div><span class="pill">ADMIN ONLY · DEMO</span></div><div class="card"><h3>เพิ่มสมาชิกใหม่</h3><div class="split"><div class="field"><label>ชื่อสมาชิก</label><input id="newName" placeholder="ชื่อที่แสดง"></div><div class="field"><label>อีเมลสมาชิก</label><input id="newEmail" type="email" placeholder="member@email.com"></div></div><button onclick="addMember()">เพิ่มสมาชิกตัวอย่าง</button><div class="small muted" style="margin-top:10px">ระบบจริงจะให้ Super Admin สร้างบัญชีผ่านเซิร์ฟเวอร์ และส่งขั้นตอนตั้งรหัสผ่านให้สมาชิก ไม่เก็บรหัสผ่านในหน้าเว็บ</div></div><div class="card section"><h3>รายชื่อสมาชิก</h3><div class="tablewrap"><table><thead><tr><th>สมาชิก</th><th>อีเมล</th><th>สถานะ</th><th>การจัดการ</th></tr></thead><tbody>'+(members.length?members.map((m,i)=>'<tr><td>'+esc(m.name)+'</td><td>'+esc(m.email)+'</td><td><span class="status '+(m.status==='pending'?'pending':m.status==='suspended'?'suspended':'')+'">'+(m.status==='pending'?'รออนุมัติ':m.status==='suspended'?'ระงับ':'ใช้งาน')+'</span></td><td><div class="actions">'+(m.status!=='active'?'<button onclick="memberStatus('+i+',\'active\')">อนุมัติ/เปิดใช้</button>':'')+(m.status!=='suspended'?'<button class="danger" onclick="memberStatus('+i+',\'suspended\')">ระงับ</button>':'<button class="secondary" onclick="memberStatus('+i+',\'active\')">เปิดใช้อีกครั้ง</button>')+'</div></td></tr>').join(''):'<tr><td colspan="4">ยังไม่มีสมาชิก</td></tr>')+'</tbody></table></div></div><div class="notice">การเพิ่มหรือเปลี่ยนสถานะตรงนี้เป็นเพียงตัวอย่าง ไม่ได้สร้างบัญชีจริงจนกว่าจะเชื่อม Supabase Auth และสิทธิ์ผู้ดูแลระบบ</div>'}
function addMember(){let n=$('newName').value.trim(),e=$('newEmail').value.trim();if(!n||!e||!e.includes('@'))return alert('กรุณากรอกชื่อและอีเมลให้ถูกต้อง');members.push({name:n,email:e,status:'pending',joined:'วันนี้'});render()}
function memberStatus(i,s){members[i].status=s;render()}
function paperView(){return '<div class="heading"><div><h1>Paper Trading</h1><div class="muted">สนามทดลองซื้อขายด้วยเงินจำลอง ไม่มีเงินจริง</div></div><span class="pill">SIMULATION ONLY</span></div><div class="grid"><div class="card metric"><label>เงินสดจำลอง</label><strong>'+money(cash)+'</strong></div><div class="card metric"><label>มูลค่าพอร์ต</label><strong>'+money(Object.entries(holdings).reduce((s,[k,q])=>s+q*prices[k],cash))+'</strong></div><div class="card metric"><label>กำไร / ขาดทุน</label><strong class="'+(pnl()>=0?'positive':'negative')+'">'+money(pnl())+'</strong></div><div class="card metric"><label>จำนวนคำสั่ง</label><strong>'+orders.length+'</strong></div></div><div class="layout"><div class="card"><h3>หุ้นตัวอย่าง · ราคาจำลอง</h3>'+Object.entries(prices).map(([s,p])=>'<div class="row"><div><div class="stock">'+s+'</div><div class="small muted">DEMO QUOTE</div></div><b>'+money(p)+'</b><div class="actions"><button onclick="trade(\''+s+'\',1)">ซื้อ 1</button><button class="secondary" onclick="trade(\''+s+'\',-1)">ขาย 1</button></div></div>').join('')+'</div><div><div class="card"><h3>การควบคุมความเสี่ยง</h3><div class="riskline"><span>ขาดทุนสูงสุดต่อวัน (จำลอง)</span><b>2% ของทุน</b></div><div class="riskline"><span>ขนาดคำสั่ง</span><b>1 หุ้น / ครั้ง</b></div><div class="riskline"><span>คำสั่งเปิดใหม่</span><b>เฉพาะเมื่อเงินพอ</b></div><button class="danger full" onclick="resetSim()">รีเซ็ตพอร์ตทดลอง</button></div><div class="card section"><h3>หุ้นที่ถืออยู่</h3>'+ (Object.keys(holdings).filter(k=>holdings[k]>0).map(k=>'<div class="row"><b>'+k+'</b><span>'+holdings[k]+' หุ้น</span><b>'+money(holdings[k]*prices[k])+'</b></div>').join('')||'<div class="empty">ยังไม่มีหุ้นในพอร์ต</div>')+'</div></div></div><div class="notice">เป้าหมายผลตอบแทน 30% ต่อวันไม่ใช่ผลตอบแทนที่รับประกัน และมีความเสี่ยงสูงมาก เราจะไม่ใช้ตัวเลขนี้เป็นคำสัญญาหรือเปิดระบบอัตโนมัติให้เสี่ยงเงินจริง</div>'}
function trade(s,side){if(side>0){if(cash<prices[s])return alert('เงินจำลองไม่เพียงพอ');cash-=prices[s];holdings[s]=(holdings[s]||0)+1;orders.unshift({side:'ซื้อ',s,qty:1,price:prices[s],time:new Date().toLocaleString('th-TH')})}else{if(!holdings[s])return alert('ไม่มีหุ้นให้ขาย');holdings[s]--;cash+=prices[s];orders.unshift({side:'ขาย',s,qty:1,price:prices[s],time:new Date().toLocaleString('th-TH')})}render()}
function resetSim(){if(confirm('ต้องการรีเซ็ตพอร์ตทดลองใช่หรือไม่?')){cash=100000;holdings={};orders=[];render()}}
function liveView(){return '<div class="heading"><div><h1>Real Trading</h1><div class="muted">ระบบซื้อขายเงินจริงผ่านโบรกเกอร์</div></div><span class="pill">NOT CONNECTED</span></div><div class="card"><div style="font-size:42px;text-align:center;padding:20px">🔒</div><h3 style="text-align:center">ระบบเงินจริงยังไม่เปิดใช้งาน</h3><p class="muted" style="text-align:center;line-height:1.8">รอการเชื่อมต่อ Broker API, การจัดเก็บ API Key ฝั่งเซิร์ฟเวอร์, การทดสอบคำสั่ง, การกำหนดวงเงิน และการอนุมัติจากเจ้าของระบบ</p><button class="full" disabled>เชื่อมต่อโบรกเกอร์ (ปิดไว้ก่อน)</button></div><div class="notice dangerbox">เพื่อป้องกันความเสียหาย จะไม่มีการส่งคำสั่งเงินจริงจากต้นแบบนี้ และจะไม่ขอให้ใส่ API Secret ในหน้าเว็บ</div>'}
function historyView(){return '<div class="heading"><div><h1>ประวัติการเทรด</h1><div class="muted">รายการคำสั่งทดลองในเซสชันนี้</div></div></div><div class="card tablewrap"><table><thead><tr><th>เวลา</th><th>ประเภท</th><th>สินทรัพย์</th><th>จำนวน</th><th>ราคา</th><th>มูลค่า</th></tr></thead><tbody>'+(orders.map(o=>'<tr><td>'+o.time+'</td><td class="'+(o.side==='ซื้อ'?'positive':'negative')+'">'+o.side+'</td><td>'+o.s+'</td><td>'+o.qty+'</td><td>'+money(o.price)+'</td><td>'+money(o.price*o.qty)+'</td></tr>').join('')||'<tr><td colspan="6" class="empty">ยังไม่มีรายการ</td></tr>')+'</tbody></table></div>'}

<style>
#authGate{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 50% -20%,#29334a 0,transparent 55%),#080b12}
#authGate .authbox{width:min(420px,100%);padding:28px;border:1px solid #705a30;border-radius:22px;background:linear-gradient(145deg,#182235,#0d1420);box-shadow:0 25px 80px #0009}
#authGate .authbrand{text-align:center;color:#e8bd62;font-size:25px;letter-spacing:4px;font-weight:900;margin-bottom:8px}
#authGate .authsub{text-align:center;color:#9aa8bc;font-size:11px;letter-spacing:2px;margin-bottom:24px}
#authGate .authmsg{min-height:22px;color:#ff9bad;font-size:12px;line-height:1.5;margin-top:10px}
#authGate .authhint{font-size:11px;color:#9aa8bc;line-height:1.7;margin-top:16px}
</style>
<section id="authGate">
 <form class="authbox" id="authForm">
  <div class="authbrand">BLESSING</div><div class="authsub">SECURE TRADING PLATFORM</div>
  <h1 style="text-align:center;font-size:21px;margin:0 0 20px">เข้าสู่ระบบ</h1>
  <div class="field"><label for="authEmail">อีเมล</label><input id="authEmail" type="email" autocomplete="username" required placeholder="name@example.com"></div>
  <div class="field"><label for="authPassword">รหัสผ่าน</label><input id="authPassword" type="password" autocomplete="current-password" required placeholder="รหัสผ่าน Supabase"></div>
  <button class="full" id="authSubmit" type="submit">เข้าสู่ระบบอย่างปลอดภัย</button>
  <div id="authMessage" class="authmsg" role="status"></div>
  <div class="authhint">บัญชีต้องได้รับการอนุมัติและเปิดใช้งานโดยผู้ดูแลระบบก่อนเข้าใช้งาน หากยังไม่มีบัญชี โปรดติดต่อผู้ดูแลระบบ</div>
 </form>
</section>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.95.0';
const sb = createClient('https://dyzumqcqvnznlkugimxo.supabase.co','sb_publishable_6RthgpRI_bdqxWjMjLVYkQ_nJzw1YWZ');
const gate=document.getElementById('authGate'), form=document.getElementById('authForm'), msg=document.getElementById('authMessage'), submit=document.getElementById('authSubmit');
function say(t){msg.textContent=t}
async function enter(session){
 if(!session?.user){gate.style.display='grid';return}
 const {data:profile,error}=await sb.from('profiles').select('email,display_name,role,status').eq('user_id',session.user.id).maybeSingle();
 if(error){say('ตรวจสอบสิทธิ์ไม่สำเร็จ กรุณาลองใหม่');await sb.auth.signOut();return}
 if(!profile||profile.status!=='active'||!['super_admin','admin','member'].includes(profile.role)){say('บัญชียังไม่ได้รับอนุมัติหรือถูกระงับ');await sb.auth.signOut();return}
 window.BLESSING_AUTH={client:sb,user:session.user,profile};
 role=profile.role==='member'?'member':'admin';
 const userbox=document.querySelector('.userbox');
 if(userbox)userbox.innerHTML='<span class="pill">'+(role==='admin'?'ADMIN WORKSPACE':'MEMBER WORKSPACE')+'</span><div class="avatar">'+(profile.display_name||profile.email||'U').slice(0,1).toUpperCase()+'</div><div><b>'+((profile.display_name||profile.email||'สมาชิก').replace(/[<>]/g,''))+'</b><div class="small muted">'+profile.role.toUpperCase()+'</div></div><button class="secondary" id="signOutBtn">ออกจากระบบ</button>';
 document.getElementById('signOutBtn')?.addEventListener('click',async()=>{await sb.auth.signOut();location.reload()});
 gate.style.display='none';
 if(role==='member'&&['members','live'].includes(active))active='overview';
 render();
}
form.addEventListener('submit',async e=>{e.preventDefault();submit.disabled=true;say('กำลังตรวจสอบบัญชี...');const {data,error}=await sb.auth.signInWithPassword({email:document.getElementById('authEmail').value.trim(),password:document.getElementById('authPassword').value});submit.disabled=false;if(error){say('เข้าสู่ระบบไม่สำเร็จ: อีเมลหรือรหัสผ่านไม่ถูกต้อง');return}await enter(data.session)});
document.addEventListener('submit',async e=>{
 if(e.target?.id!=='changePasswordForm')return;
 e.preventDefault();
 const p=document.getElementById('newPassword')?.value||'';
 const q=document.getElementById('confirmPassword')?.value||'';
 const out=document.getElementById('passwordMessage');
 const btn=document.getElementById('changePasswordBtn');
 if(p.length<8){out.textContent='รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร';out.style.color='#ff9bad';return}
 if(p!==q){out.textContent='รหัสผ่านทั้งสองช่องไม่ตรงกัน';out.style.color='#ff9bad';return}
 if(!window.BLESSING_AUTH?.client){out.textContent='กรุณาเข้าสู่ระบบใหม่ก่อนเปลี่ยนรหัสผ่าน';out.style.color='#ff9bad';return}
 btn.disabled=true;out.textContent='กำลังบันทึกรหัสผ่านใหม่...';out.style.color='#9aa8bc';
 const {error}=await window.BLESSING_AUTH.client.auth.updateUser({password:p});
 btn.disabled=false;
 if(error){out.textContent='เปลี่ยนรหัสผ่านไม่สำเร็จ: '+error.message;out.style.color='#ff9bad';return}
 e.target.reset();out.textContent='เปลี่ยนรหัสผ่านเรียบร้อยแล้ว';out.style.color='#43d6a0';
});
const {data:{session}}=await sb.auth.getSession();await enter(session);
sb.auth.onAuthStateChange((_event,session)=>{if(!session){gate.style.display='grid'}});
</script>
