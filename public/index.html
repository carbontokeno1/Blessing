display:grid;place-items:center;background:#493a20;color:var(--gold);font-weight:900}.tabs{display:flex;gap:8px;overflow:auto;padding:17px 0}.tab{white-space:nowrap;background:#131d2c;border:1px solid #2d3a4e;color:#b9c5d6}.tab.active{background:#332a19;color:var(--gold);border-color:#81652e}.heading{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin:10px 0 18px}.heading h1{margin:0;font-size:26px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:15px 0}.card{background:linear-gradient(145deg,#151f30,#0e1623);border:1px solid var(--line);border-radius:16px;padding:17px;min-width:0}.metric label{font-size:11px;color:var(--muted)}.metric strong{display:block;font-size:25px;margin-top:8px;font-variant-numeric:tabular-nums}.layout{display:grid;grid-template-columns:1.35fr 1fr;gap:14px}.card h3{margin:0 0 14px;font-size:15px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #283448}.row:last-child{border:0}.stock{font-weight:800}.positive{color:var(--green)}.negative{color:var(--red)}.actions{display:flex;gap:6px}.actions button{padding:7px 10px;font-size:11px}.pill{border:1px solid #66542e;border-radius:30px;padding:5px 9px;color:var(--gold);font-size:10px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #283448;font-size:12px}th{color:var(--muted);font-weight:600}.status{font-size:10px;border-radius:20px;padding:5px 8px;background:#19372e;color:#70e4b7}.status.pending{background:#3c321d;color:#f1ce77}.status.suspended{background:#40212a;color:#ff9bad}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar input{max-width:220px}.notice{border:1px solid #6d572d;background:#211b11;color:#ead8a8;border-radius:13px;padding:13px;font-size:12px;line-height:1.65;margin:14px 0}.dangerbox{border-color:#6c3340;background:#25131b;color:#ffb0b <script>
const $=id=>document.getElementById(id);let role='admin',active='overview',members=[],marketQuotes={},marketStatus='รอเชื่อม Webull OpenAPI';const money=n=>'฿'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});const names={overview:'ภาพรวมตลาด',crypto:'ตลาดคริปโต',members:'จัดการสมาชิก',paper:'ทดสอบกลยุทธ์',live:'เทรดเงินจริง',history:'ประวัติ',settings:'ตั้งค่า'};
const stockSymbols=['AAPL','MSFT','NVDA','AMZN','GOOGL','META','TSLA','AMD'];
const STRATEGY_CONFIG=Object.freeze({entryMode:'FAST',profitMode:'ADAPTIVE',minChangePct:3,minRelativeVolume:2,maxSpreadPct:0.5,minPrice:2,minVolume:100000,minTargetPct:30,maxTargetPct:50,allowedSessions:['PRE_MARKET','CORE','AFTER_HOURS']});
const cryptoSymbols=['BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT','XRPUSDT','DOGEUSDT'];
const cryptoNames={BTCUSDT:'Bitcoin',ETHUSDT:'Ethereum',BNBUSDT:'BNB',SOLUSDT:'Solana',XRPUSDT:'XRP',DOGEUSDT:'Dogecoin'};
let cryptoQuotes={},cryptoStatus={Binance:'กำลังเชื่อมต่อ',Bybit:'กำลังเชื่อมต่อ',OKX:'กำลังเชื่อมต่อ'},cryptoBusy=false,cryptoTimer=null,cryptoExchange='ALL';
let marketSocket=null,marketReconnectTimer=null,marketBridgeStarted=false;

function nav(){let keys=role==='admin'?['overview','crypto','members','paper','live','history','settings']:['overview','crypto','paper','live','history','settings'];$('tabs').innerHTML=keys.map(k=>'<button class="tab '+(active===k?'active':'')+'" onclick="go(\''+k+'\')">'+names[k]+'</button>').join('')}
function go(k){active=k;render()}
function render(){nav();let v=$('view');if(active==='overview'){v.innerHTML=overview();if(role==='member')loadMemberData()}if(active==='crypto'){v.innerHTML=cryptoView();refreshCrypto()}if(active==='members'){v.innerHTML=membersView();if(role==='admin')loadAdminMembers()}if(active==='paper')v.innerHTML=paperView();if(active==='live')v.innerHTML=liveView();if(active==='history'){v.innerHTML=historyView();loadHistory()}if(active==='settings')v.innerHTML=settingsView();renderMarketCards()} async function loadMemberData(){const sb=window.BLESSING_AUTH?.client;if(!sb)return;const [w,t]=await Promise.all([sb.from('wallets').select('currency,balance').order('currency'),sb.from('trades').select('id,mode,symbol,side,quantity,price,status,created_at').order('created_at',{ascending:false}).limit(5)]);const b=document.getElementById('memberBalance'),n=document.getElementById('memberTradeCount'),r=document.getElementById('memberRecent');if(b)b.textContent=w.error?'โหลดไม่ได้':(w.data?.length?w.data.map(x=>Number(x.balance).toLocaleString('en-US')+' '+x.currency).join(' / '):'ยังไม่มีข้อมูล');if(n)n.textContent=t.error?'—':String(t.data?.length||0);if(r)r.innerHTML=t.error?'โหลดข้อมูลไม่สำเร็จ':(t.data?.length?t.data.map(x=>'<div class=\'row\'><span>'+esc(x.side)+' '+esc(x.symbol)+' · '+esc(x.mode)+'</span><b>'+Number(x.quantity).toLocaleString()+'</b></div>').join(''):'ยังไม่มีรายการเทรด')}
const MARKET_BRIDGE_URL='https://blessing-webull-realtime.onrender.com';
let marketSocket=null,marketReconnectTimer=null,marketBridgeStarted=false;
function quoteField(raw,keys){if(!raw||typeof raw!=='object')return null;for(const [k,v] of Object.entries(raw)){if(keys.includes(k.toLowerCase())&&v!==null&&v!==undefined&&v!=='')return v}for(const v of Object.values(raw)){if(v&&typeof v==='object'){const found=quoteField(v,keys);if(found!==null)return found}}return null}

function quoteDisplay(symbol){const q=marketQuotes[symbol];if(!q)return {price:'—',bid:'—',ask:'—',time:'รอข้อมูล'};const raw=q.raw||{};return {price:formatUsd(quoteField(raw,['price','last_price','lastprice','close','trade_price'])),bid:formatUsd(quoteField(raw,['bid','bid_price','bidprice'])),ask:formatUsd(quoteField(raw,['ask','ask_price','askprice'])),time:q.receivedAt?new Date(q.receivedAt).toLocaleTimeString('th-TH'):'—'}}
function connectMarketBridge(){
 if(marketBridgeStarted)return;marketBridgeStarted=true;
 fetch(MARKET_BRIDGE_URL+'/status',{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject()).then(s=>{marketStatus=s.connection==='streaming'?'รับข้อมูล Webull สด':s.connection==='connected'?'เชื่อม Webull แล้ว':'Webull: '+s.connection;renderMarketCards()}).catch(()=>{marketStatus='รอเปิดบริการข้อมูลสด';renderMarketCards()});
 const schedule=()=>{if(marketReconnectTimer)clearTimeout(marketReconnectTimer);marketReconnectTimer=setTimeout(open,5000)};
 const open=()=>{try{marketSocket=new WebSocket(MARKET_BRIDGE_URL.replace(/^http/,'ws')+'/stream');marketSocket.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.status){const s=m.status;marketStatus=s.connection==='streaming'?'รับข้อมูล Webull สด':s.connection==='connected'?'เชื่อม Webull แล้ว':'Webull: '+s.connection}if(m.data)marketQuotes=m.data;scanMarketAlerts();renderMarketCards()}catch(err){}};marketSocket.onclose=schedule;marketSocket.onerror=()=>{try{marketSocket.close()}catch(e){}}}catch(e){schedule()}};
 open();window.addEventListener('beforeunload',()=>{if(marketSocket)marketSocket.close()});
}
function formatUsd(v){const n=Number(v);return Number.isFinite(n)?'$'+n.toFixed(2):'—'}
function adaptiveProfitTarget({atrPct,relativeVolume,momentumPct}={}){
 const clamp=(v,min,max)=>Math.max(min,Math.min(max,Number.isFinite(Number(v))?Number(v):min));
 const volatility=clamp((clamp(atrPct,0,12)-2)/10,0,1),volume=clamp((clamp(relativeVolume,0,10)-2)/8,0,1),momentum=clamp((clamp(momentumPct,0,20)-3)/17,0,1);
 return Math.round((30+(volatility*.5+volume*.3+momentum*.2)*20)*10)/10;
}
function evaluateFastEntry(snapshot,bars){
 const fail=reason=>({eligible:false,reason});
 if(!snapshot||String(snapshot.provider||'').toLowerCase()!=='webull')return fail('รอข้อมูลยืนยันจาก Webull');
 const n=k=>Number(snapshot[k]),price=n('price'),change=n('changePct'),rv=n('relativeVolume'),bid=n('bid'),ask=n('ask'),volume=n('volume');
 if(![price,change,rv,bid,ask,volume].every(Number.isFinite))return fail('ข้อมูลราคา/ปริมาณไม่ครบ');
 if(!STRATEGY_CONFIG.allowedSessions.includes(snapshot.session))return fail('อยู่นอกช่วงเวลาที่กำหนด');
 if(!Number.isFinite(Number(snapshot.timestampMs))||Date.now()-Number(snapshot.timestampMs)>120000)return fail('ข้อมูล Webull เก่าเกินไป');
 if(price<2||volume<100000)return fail('ราคา/สภาพคล่องไม่ผ่านเกณฑ์');
 if(change<3||rv<2)return fail('Momentum หรือ Relative Volume ยังไม่ผ่าน');
 const spreadPct=((ask-bid)/price)*100;
 if(bid<=0||ask<bid||spreadPct>0.5)return fail('ส่วนต่าง Bid/Ask กว้างเกินเกณฑ์');
 if(!Array.isArray(bars)||bars.length<5)return fail('ต้องมีแท่งราคาจริงอย่างน้อย 5 แท่ง');
 const prior=bars.slice(-6,-1).map(x=>Number(x.high)).filter(Number.isFinite);
 if(prior.length<5||price<=Math.max(...prior))return fail('ยังไม่ยืนยัน Breakout');
 return {eligible:true,reason:'ผ่านเกณฑ์ Fast Entry',spreadPct,targetPct:adaptiveProfitTarget({atrPct:snapshot.atrPct,relativeVolume:rv,momentumPct:change})};
}


let marketAlerts=[],alertCooldown={},alertNotificationReady=false;
function alertNumber(raw,keys){const v=quoteField(raw,keys);const n=Number(v);return Number.isFinite(n)?n:NaN}
function pushMarketAlert(key,item){
 const now=Date.now();if(alertCooldown[key]&&now-alertCooldown[key]<600000)return;
 alertCooldown[key]=now;marketAlerts.unshift({...item,at:now});marketAlerts=marketAlerts.slice(0,20);
 if(alertNotificationReady&&'Notification'in window&&Notification.permission==='granted'){try{new Notification('BLESSING · '+item.kind,{body:item.symbol+' · '+item.message,tag:key})}catch(e){}}
 renderAlertPanel();
}
function scanMarketAlerts(){
 // หุ้น: แจ้งเฉพาะเมื่อ Webull ส่งข้อมูลครบและผ่าน FAST ENTRY จริง
 for(const symbol of stockSymbols){
  const q=marketQuotes[symbol];if(!q)continue;const raw=q.raw||q;
  const price=alertNumber(raw,['price','last_price','lastprice','close','trade_price']);
  const snapshot={provider:q.provider||raw.provider||'webull',price,
   changePct:alertNumber(raw,['changePct','change_percent','priceChangePercent','changePercent','pct_change']),
   relativeVolume:alertNumber(raw,['relativeVolume','relative_volume','rvol']),
   bid:alertNumber(raw,['bid','bid_price','bidprice']),ask:alertNumber(raw,['ask','ask_price','askprice']),
   volume:alertNumber(raw,['volume','total_volume','day_volume']),session:raw.session||q.session,
   timestampMs:Number(q.timestampMs||q.receivedAt||raw.timestampMs||raw.timestamp||0),
   atrPct:alertNumber(raw,['atrPct','atr_pct'])};
  const bars=q.bars||raw.bars||raw.candles;
  const result=evaluateFastEntry(snapshot,bars);
  if(result.eligible)pushMarketAlert('stock:'+symbol,{kind:'หุ้นเข้าเป้า',symbol,message:'FAST ENTRY ผ่านเกณฑ์ · เป้าหมายปรับตามความผันผวน '+result.targetPct+'%',direction:'up'});
 }
 // คริปโต: ใช้ค่าเปลี่ยนแปลง 24 ชม. เป็นสัญญาณเฝ้าระวัง ไม่ใช่สัญญาณเข้าเทรด
 for(const symbol of cryptoSymbols){
  const candidates=['Binance','Bybit','OKX'].map(ex=>({ex,q:cryptoQuotes[ex]?.[symbol]})).filter(x=>x.q&&Date.now()-x.q.ts<60000&&Number.isFinite(x.q.change));
  if(!candidates.length)continue;
  const valid=candidates.filter(x=>x.q.bid>0&&x.q.ask>=x.q.bid&&((x.q.ask-x.q.bid)/x.q.last)*100<=0.5);
  if(!valid.length)continue;
  const best=valid.sort((a,b)=>b.q.change-a.q.change)[0];
  if(best.q.change>=3)pushMarketAlert('crypto:'+symbol,{kind:'คริปโต Momentum',symbol:symbol.replace('USDT','')+'/USDT',message:'บวก '+best.q.change.toFixed(2)+'% ใน 24 ชม. · '+best.ex+' · Spread ผ่านเกณฑ์เบื้องต้น',direction:'up'});
  else if(best.q.change<=-3)pushMarketAlert('crypto-down:'+symbol,{kind:'คริปโตเฝ้าระวัง',symbol:symbol.replace('USDT','')+'/USDT',message:'ติดลบ '+best.q.change.toFixed(2)+'% ใน 24 ชม. · '+best.ex,direction:'down'});
 }
}
function renderAlertPanel(){
 const el=document.getElementById('marketAlertRows');if(!el)return;
 el.innerHTML=marketAlerts.length?marketAlerts.map(a=>'<div class="riskline"><span><b class="'+(a.direction==='down'?'negative':'positive')+'">'+esc(a.kind)+'</b> · '+esc(a.symbol)+'<div class="small muted">'+esc(a.message)+'</div></span><small class="muted">'+new Date(a.at).toLocaleTimeString('th-TH')+'</small></div>').join(''):'<div class="empty">ยังไม่พบสินทรัพย์ที่ผ่านเงื่อนไข · ระบบกำลังสแกนตลาด</div>';
}
function marketAlertPanel(){return '<div class="card section"><div class="heading"><div><h3>Market Alert · แจ้งเตือนสินทรัพย์เข้าเป้า</h3><div class="small muted">สแกนหุ้น Webull และคริปโตจาก Binance / Bybit / OKX</div></div><button class="secondary" onclick="enableMarketNotifications()">เปิดการแจ้งเตือน</button></div><div id="marketAlertRows"><div class="empty">กำลังสแกนตลาด...</div></div><div class="small muted" style="margin-top:8px">หุ้นจะแจ้งเมื่อข้อมูล Webull ครบและผ่าน FAST ENTRY; คริปโตใช้การเปลี่ยนแปลง 24 ชม. ≥ ±3% และ Spread ≤ 0.50% เป็นสัญญาณเฝ้าระวังเท่านั้น</div></div>'}
async function enableMarketNotifications(){if(!('Notification'in window)){alert('เบราว์เซอร์นี้ไม่รองรับการแจ้งเตือน');return}const p=await Notification.requestPermission();alertNotificationReady=p==='granted';alert(p==='granted'?'เปิดการแจ้งเตือนแล้ว':'ยังไม่ได้อนุญาตการแจ้งเตือน')}

function cryptoView(){
 return '<div class="heading"><div><h1>ตลาดคริปโต · Multi-Exchange</h1><div class="muted">เปรียบเทียบตลาด Spot จาก Binance · Bybit · OKX</div></div><span class="pill">PUBLIC MARKET DATA</span></div>'+
 '<div class="grid"><div class="card metric"><label>ตลาดที่รองรับ</label><strong style="font-size:18px">3 Exchanges</strong></div><div class="card metric"><label>คู่เหรียญติดตาม</label><strong>6 Pairs</strong></div><div class="card metric"><label>รูปแบบข้อมูล</label><strong style="font-size:17px">Spot · USDT</strong></div><div class="card metric"><label>การซื้อขายเงินจริง</label><strong class="negative" style="font-size:17px">ปิดใช้งาน</strong></div></div>'+
 '<div class="card"><div class="heading"><div><h3>เลือก Exchange</h3><div class="small muted">เลือกแสดงราคาแยกตลาด หรือเทียบทุกตลาดพร้อมกัน</div></div><button class="secondary" onclick="refreshCrypto()">รีเฟรชราคา</button></div><div class="toolbar"><select id="cryptoExchangeSelect" onchange="setCryptoExchange(this.value)"><option value="ALL">เปรียบเทียบทุก Exchange</option><option value="Binance">Binance</option><option value="Bybit">Bybit</option><option value="OKX">OKX</option></select></div><div id="cryptoStatusRow" class="split section"></div></div>'+
 '<div class="card section"><div class="heading"><div><h3>กระดานราคาเหรียญ</h3><div class="small muted">ราคาและการเปลี่ยนแปลง 24 ชั่วโมงจาก API สาธารณะของแต่ละ Exchange</div></div><span class="pill" id="cryptoUpdated">รอข้อมูลจริง</span></div><div class="tablewrap"><table><thead><tr><th>เหรียญ</th><th>Exchange</th><th>Last (USDT)</th><th>Bid</th><th>Ask</th><th>24h %</th><th>สถานะ</th></tr></thead><tbody id="cryptoRows"><tr><td colspan="7" class="muted">กำลังดึงข้อมูลจากตลาดจริง...</td></tr></tbody></table></div></div>'+
 '<div class="card section"><h3>ตัวกรอง Momentum · FAST</h3><div class="split"><div><div class="riskline"><span>ตลาด</span><b>Spot / USDT</b></div><div class="riskline"><span>แนวทาง</span><b>Momentum + Spread</b></div><div class="riskline"><span>กรองการเปลี่ยนแปลง</span><b>≥ 3% / 24h</b></div></div><div><div class="riskline"><span>Spread สูงสุดเบื้องต้น</span><b>0.50%</b></div><div class="riskline"><span>Stop Loss</span><b>ต้องคำนวณจาก ATR/แท่งเทียน</b></div><div class="riskline"><span>เป้ากำไร</span><b>ปรับตามความผันผวน</b></div></div></div><div class="notice">ตารางนี้เป็นข้อมูลตลาดจริงและตัวกรองเบื้องต้น ไม่ใช่คำสั่งซื้อหรือสัญญาณเข้าซื้อที่ยืนยันแล้ว ต้องเพิ่มข้อมูลแท่งเทียน, ATR, สภาพคล่อง และทดสอบย้อนหลัง ก่อนเปิดระบบแจ้งสัญญาณอัตโนมัติ</div></div>'+
 '<div class="notice dangerbox">ขณะนี้เชื่อมเฉพาะข้อมูลตลาดสาธารณะ ยังไม่เชื่อมบัญชีส่วนตัว ไม่อ่านยอดเงิน และไม่ส่งคำสั่งซื้อขายหรือถอนเหรียญ</div>';

function renderCryptoRows(){

 }}

async function refreshCrypto(){
 if(cryptoBusy)return;cryptoBusy=true;
 const ts=Date.now(),urlBin='https://data-api.binance.vision/api/v3/ticker/24hr?symbols='+encodeURIComponent(JSON.stringify(cryptoSymbols));
 const urlBy='https://api.bybit.com/v5/market/tickers?category=spot';
 const urlOk='https://www.okx.com/api/v5/market/tickers?instType=SPOT';
 const jobs=[
  fetch(urlBin,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{const map={};for(const x of data){map[x.symbol]={last:Number(x.lastPrice),bid:Number(x.bidPrice),ask:Number(x.askPrice),change:Number(x.priceChangePercent),ts:Number(x.closeTime)||ts};}cryptoQuotes.Binance=map;cryptoStatus.Binance='เชื่อมต่อสำเร็จ'}).catch(e=>{cryptoStatus.Binance='เชื่อมต่อไม่ได้';console.warn('Binance public market data',e)}),
  fetch(urlBy,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{if(data.retCode!==0)throw Error(data.retMsg||'API error');const map={};for(const x of data.result?.list||[]){if(cryptoSymbols.includes(x.symbol))map[x.symbol]={last:Number(x.lastPrice),bid:Number(x.bid1Price),ask:Number(x.ask1Price),change:Number(x.price24hPcnt)*100,ts:Number(data.time)||ts};}cryptoQuotes.Bybit=map;cryptoStatus.Bybit='เชื่อมต่อสำเร็จ'}).catch(e=>{cryptoStatus.Bybit='เชื่อมต่อไม่ได้';console.warn('Bybit public market data',e)}),
  fetch(urlOk,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{if(data.code!=='0')throw Error(data.msg||'API error');const map={};for(const x of data.data||[]){const sym=String(x.instId||'').replace('-','');if(cryptoSymbols.includes(sym)){const last=Number(x.last),open=Number(x.open24h);map[sym]={last,bid:Number(x.bidPx),ask:Number(x.askPx),change:open>0?(last/open-1)*100:NaN,ts:Number(x.ts)||ts};}}cryptoQuotes.OKX=map;cryptoStatus.OKX='เชื่อมต่อสำเร็จ'}).catch(e=>{cryptoStatus.OKX='เชื่อมต่อไม่ได้';console.warn('OKX public market data',e)})
 ];
 await Promise.all(jobs);cryptoBusy=false;scanMarketAlerts();renderCryptoRows();
 if(!cryptoTimer)cryptoTimer=setInterval(refreshCrypto,20000);
}

 if(error){say('ตรวจสอบสิทธิ์ไม่สำเร็จ กรุณาลองใหม่');await sb.auth.signOut();return}
 if(!profile||profile.status!=='active'||!['super_admin','admin','member'].includes(profile.role)){say('บัญชียังไม่ได้รับอนุมัติหรือถูกระงับ');await sb.auth.signOut();return}
 window.BLESSING_AUTH={client:sb,user:session.user,profile};
 role=profile.role==='member'?'member':'admin';
 const userbox=document.querySelector('.userbox');
 if(userbox)userbox.innerHTML='<span class="pill">'+(role==='admin'?'ADMIN WORKSPACE':'MEMBER WORKSPACE')+'</span><div class="avatar">'+(profile.display_name||profile.email||'U').slice(0,1).toUpperCase()+'</div><div><b>'+((profile.display_name||profile.email||'สมาชิก').replace(/[<>]/g,''))+'</b><div class="small muted">'+profile.role.toUpperCase()+'</div></div><button class="secondary" id="signOutBtn">ออกจากระบบ</button>';
 document.getElementById('signOutBtn')?.addEventListener('click',async()=>{await sb.auth.signOut();location.reload()});
 gate.style.display='none';
 if(role==='member'&&['members','live'].includes(active))active='overview';
 render();
}
let recoveryMode=location.hash.includes('type=recovery')||location.search.includes('code=');
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-toggle-password]');
 if(t){const input=document.getElementById(t.dataset.togglePassword);if(!input)return;const show=input.type==='password';input.type=show?'text':'password';t.textContent=show?'ซ่อน':'แสดง';t.setAttribute('aria-label',show?'ซ่อนรหัสผ่าน':'แสดงรหัสผ่าน');t.setAttribute('aria-pressed',String(show))}
});
document.getElementById('showForgot').addEventListener('click',()=>{document.getElementById('forgotPanel').classList.toggle('hidden');document.getElementById('forgotEmail').value=document.getElementById('authEmail').value.trim()});
document.getElementById('sendReset').addEventListener('click',async()=>{
 const email=document.getElementById('forgotEmail').value.trim(),out=document.getElementById('forgotMessage'),btn=document.getElementById('sendReset');
 if(!email){out.textContent='กรุณากรอกอีเมลก่อน';return}
 btn.disabled=true;out.textContent='กำลังส่งลิงก์...';
 const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/'});
 btn.disabled=false;
 out.textContent=error?'ส่งลิงก์ไม่สำเร็จ: '+error.message:'หากอีเมลนี้มีบัญชีอยู่ ระบบจะส่งลิงก์ตั้งรหัสผ่านใหม่ให้ กรุณาตรวจสอบกล่องจดหมายและ Spam';
});
function showRecoveryForm(){
 gate.style.display='grid';
 form.innerHTML='<div class="authbrand">BLESSING</div><div class="authsub">SECURE ACCOUNT RECOVERY</div><h1 style="text-align:center;font-size:21px">ตั้งรหัสผ่านใหม่</h1><div class="field"><label for="recoveryPassword">รหัสผ่านใหม่ (อย่างน้อย 8 ตัวอักษร)</label><div class="password-wrap"><input id="recoveryPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="กรอกรหัสผ่านใหม่"><button class="eye-btn" type="button" data-toggle-password="recoveryPassword">แสดง</button></div></div><div class="field"><label for="recoveryConfirm">ยืนยันรหัสผ่านใหม่</label><div class="password-wrap"><input id="recoveryConfirm" type="password" minlength="8" autocomplete="new-password" required placeholder="กรอกรหัสผ่านอีกครั้ง"><button class="eye-btn" type="button" data-toggle-password="recoveryConfirm">แสดง</button></div></div><button class="full" id="saveRecovery" type="submit">บันทึกรหัสผ่านใหม่</button><div id="authMessage" class="authmsg" role="status"></div>';
 form.onsubmit=async e=>{
  e.preventDefault();const p=document.getElementById('recoveryPassword').value,q=document.getElementById('recoveryConfirm').value;
  if(p.length<8){say('รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร');return}
  if(p!==q){say('รหัสผ่านทั้งสองช่องไม่ตรงกัน');return}
  const b=document.getElementById('saveRecovery');b.disabled=true;say('กำลังบันทึกรหัสผ่าน...');const {error}=await sb.auth.updateUser({password:p});b.disabled=false;
  if(error){say('ตั้งรหัสผ่านไม่สำเร็จ: '+error.message);return}
  say('ตั้งรหัสผ่านใหม่สำเร็จ กำลังเข้าสู่ระบบ...');history.replaceState(null,'',location.pathname);recoveryMode=false;const {data}=await sb.auth.getSession();await enter(data.session);
 };
}
form.addEventListener('submit',async e=>{if(recoveryMode)return;e.preventDefault();submit.disabled=true;say('กำลังตรวจสอบบัญชี...');const {data,error}=await sb.auth.signInWithPassword({email:document.getElementById('authEmail').value.trim(),password:document.getElementById('authPassword').value});submit.disabled=false;if(error){say('เข้าสู่ระบบไม่สำเร็จ: อีเมลหรือรหัสผ่านไม่ถูกต้อง');return}await enter(data.session)});
document.getElementById('authEmail').addEventListener('input',e=>{const x=document.getElementById('forgotEmail');if(x&&!x.value)x.value=e.target.value});
document.addEventListener('submit',async e=>{
 if(e.target?.id!=='changePasswordForm')return;
 e.preventDefault();
 const p=document.getElementById('newPassword')?.value||'';
 const q=document.getElementById('confirmPassword')?.value||'';
 const out=document.getElementById('passwordMessage');
 const btn=document.getElementById('changePasswordBtn');
 if(p.length<8){out.textContent='รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร';out.style.color='#ff9bad';return}
 if(p!==q){out.textContent='รหัสผ่านทั้งสองช่องไม่ตรงกัน';out.style.color='#ff9bad';return}
 if(!window.BLESSING_AUTH?.client){out.textContent='กรุณาเข้าสู่ระบบใหม่ก่อนเปลี่ยนรหัสผ่าน';out.style.color='#ff9bad';return}
 btn.disabled=true;out.textContent='กำลังบันทึกรหัสผ่านใหม่...';out.style.color='#9aa8bc';
 const {error}=await window.BLESSING_AUTH.client.auth.updateUser({password:p});
 btn.disabled=false;
 if(error){out.textContent='เปลี่ยนรหัสผ่านไม่สำเร็จ: '+error.message;out.style.color='#ff9bad';return}
 e.target.reset();out.textContent='เปลี่ยนรหัสผ่านเรียบร้อยแล้ว';out.style.color='#43d6a0';
});
sb.auth.onAuthStateChange((event,session)=>{
 if(event==='PASSWORD_RECOVERY'){recoveryMode=true;showRecoveryForm();return}
 if(event==='SIGNED_OUT'){gate.style.display='grid';return}
 if(event==='SIGNED_IN'&&session&&!recoveryMode)enter(session);
});
const {data:{session}}=await sb.auth.getSession();
if(recoveryMode){showRecoveryForm()}else{await enter(session)}
</script>
</body></html>
